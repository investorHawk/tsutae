[project]
name = "tsutae"
version = "0.1.0"
description = "外来化学療法の患者記録を、医師が決めた形式の A4 一枚に変換する（症例は全て合成）"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk==0.2.177",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "pywebpush==2.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["tsutae*"]

[tool.setuptools.package-data]
tsutae = ["**/*.json", "**/*.txt", "**/*.j2", "**/*.css", "**/*.sql"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

